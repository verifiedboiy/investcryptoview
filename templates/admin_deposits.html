<!doctype html>
<html>
<head><meta charset="utf-8"><title>Admin — Deposits</title></head>
<body style="font-family:Inter,Arial;background:#f1f5f9;margin:0">
  <div style="display:flex">
    <aside style="width:260px;background:#1e293b;color:#cbd5e1;padding:16px">Admin</aside>
    <main style="padding:22px;flex:1">
      <h2>Deposits</h2>
      <table border="0" cellpadding="10" style="background:#fff;padding:12px;border-radius:12px;box-shadow:0 10px 30px rgba(2,8,23,.06)">
        <thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Asset</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>
          {% for d in deposits %}
            <tr>
              <td>{{ d.id }}</td>
              <td>{{ d.user_id }}</td>
              <td>${{ '%.2f'|format(d.amount|float) }}</td>
              <td>{{ d.asset }} / {{ d.network }}</td>
              <td>{{ d.status }}</td>
              <td>
                {% if d.status == 'pending' %}
                  <form style="display:inline" method="post" action="{{ url_for('admin_deposit_approve', dep_id=d.id) }}"><button>Approve</button></form>
                  <form style="display:inline" method="post" action="{{ url_for('admin_deposit_decline', dep_id=d.id) }}"><button>Decline</button></form>
                {% else %}
                  {{ d.admin_action_time or '' }}
                {% endif %}
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </main>
  </div>
</body>
</html>
