<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KYC Upload — InvestCryptoView</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{--sidebar:#1e293b;--primary:#2563eb;--page:#f1f5f9;--card:#fff;--radius:14px;--shadow:0 10px 30px rgba(2,8,23,.08)}
body{margin:0;background:var(--page);font:15px Inter;color:#0f172a}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--sidebar);color:#cbd5e1;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;padding:0 22px 14px}
.brand i{color:var(--primary)}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 22px;border-left:4px solid transparent}
.nav a:hover,.nav a.active{background:#334155;color:#fff;border-left-color:var(--primary)}
.main{background:#fff;padding:22px 28px;box-shadow:inset 0 0 0 1px #e2e8f0}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;max-width:640px}
label{font-weight:700;display:block;margin:8px 0 6px}
select,input{width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:10px}
.btn{padding:12px;border:none;border-radius:10px;font-weight:800;background:var(--primary);color:#fff;width:100%;cursor:pointer}
.success{display:none;margin-top:14px;border:1px solid #bbf7d0;background:#ecfdf5;color:#065f46;padding:12px;border-radius:10px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<aside class="sidebar">
  <div class="brand"><i class="fa-solid fa-chart-line"></i>InvestCryptoView</div>
</aside>

<main class="main">
  <div class="card">
    <h2>Document Upload</h2>
    <p>To verify your identity, please upload any of your document below.</p>
    <label>Document Type</label>
    <select id="doctype">
      <option>Passport</option><option>Driver License</option><option>National ID</option>
    </select>

    <label>Front Image</label>
    <input type="file" accept="image/*" capture="environment"/>

    <label>Back Image</label>
    <input type="file" accept="image/*" capture="environment"/>

    <button class="btn" id="submit"><i class="fa-solid fa-paper-plane"></i> Submit</button>
    <div class="success" id="done"><i class="fa-solid fa-circle-check"></i> Submitted — you are on the wait list for verification (24 h).</div>
  </div>
</main>
</div>
<script>
document.getElementById('submit').onclick=()=>document.getElementById('done').style.display='block';
</script>
</body>
</html>
