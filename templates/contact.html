<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Contact — InvestCryptoView</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{--sidebar:#1e293b;--primary:#2563eb;--page:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--radius:14px;--shadow:0 10px 30px rgba(2,8,23,.08)}
body{margin:0;background:var(--page);font:15px/1.45 Inter,system-ui;color:var(--text)}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--sidebar);color:#cbd5e1;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;padding:0 22px 14px}
.brand i{color:var(--primary)}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 22px;border-left:4px solid transparent}
.nav a:hover,.nav a.active{background:#334155;color:#fff;border-left-color:var(--primary)}
.telegram{display:flex;align-items:center;gap:8px;background:#229ED9;color:#fff;border-radius:999px;padding:10px 14px;margin:18px 22px;justify-content:center}
.main{background:#fff;padding:22px 28px;box-shadow:inset 0 0 0 1px #e2e8f0}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;max-width:700px;margin:auto;text-align:center}
.card i{font-size:2.2rem;color:var(--primary);margin-bottom:10px}
.card a{color:var(--primary);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<aside class="sidebar">
  <div class="brand"><i class="fa-solid fa-chart-line"></i>InvestCryptoView</div>
  <nav class="nav">
    <a href="{{ url_for('main') }}"><i class="fa-solid fa-house"></i>Dashboard</a>
    <a href="{{ url_for('trades') }}"><i class="fa-solid fa-arrows-rotate"></i>Trades</a>
    <a href="{{ url_for('deposit') }}"><i class="fa-solid fa-circle-plus"></i>Deposit</a>
    <a href="{{ url_for('withdraw') }}"><i class="fa-solid fa-circle-minus"></i>Withdraw</a>
    <a href="{{ url_for('kyc') }}"><i class="fa-solid fa-id-card"></i>KYC</a>
    <a href="{{ url_for('about') }}"><i class="fa-solid fa-circle-info"></i>About</a>
    <a class="active" href="{{ url_for('contact') }}"><i class="fa-solid fa-envelope"></i>Contact</a>
  </nav>
  <!-- Telegram button at the bottom -->
  <a href="https://t.me/IFPBrokeragent" class="telegram" target="_blank">
    <i class="fab fa-telegram"></i> Telegram
  </a>
</aside>

<main class="main">
  <div class="card">
    <i class="fa-solid fa-headset"></i>
    <h2>Contact Support</h2>
    <p>Need help? Our team is available 24/7 to assist with your account, payments, or trading issues.</p>
    <p><i class="fa-solid fa-envelope"></i> <strong>Email:</strong> <a href="mailto:invest.cryptoview@mail.com">invest.cryptoview@mail.com</a></p>
    <p><i class="fa-brands fa-telegram"></i> <strong>Telegram:</strong> <a href="https://t.me/IFPBrokeragent">t.me/IFPBrokeragent</a></p>
    <p><i class="fa-solid fa-phone"></i> <strong>Phone:</strong> Coming soon</p>
  </div>
</main>
</div>
</body>
</html>
