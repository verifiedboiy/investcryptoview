{% extends "base_auth.html" %}
{% block content %}

<div class="signup-container">
  <h2><i class="fa-solid fa-shield-halved"></i> Verify Reset Code</h2>

  {% if error %}
    <div class="flash" style="color:red;">{{ error }}</div>
  {% elif message %}
    <div class="flash" style="color:green;">{{ message }}</div>
  {% endif %}

  <form method="POST" class="signup-form">
    <div class="input-box">
      <i class="fa-solid fa-hashtag"></i>
      <input type="text" name="code" placeholder="Enter 6-digit code" maxlength="6" required>
    </div>

    <button type="submit">
      <i class="fa-solid fa-check"></i> Verify Code
    </button>

    <p class="small-text">
  Didn’t get the code? <a href="#" id="resend" class="red">Resend</a>
</p>

<script>
const resend = document.getElementById("resend");
let timer = null;

resend.addEventListener("click", async (e) => {
  e.preventDefault();
  if (resend.classList.contains("disabled")) return;

  resend.classList.add("disabled");
  resend.style.pointerEvents = "none";
  resend.style.color = "gray";

  let countdown = 30;
  resend.textContent = 'Resend (' + countdown + 's)';

  // ✅ Call backend to resend email
  await fetch("/reset_resend");

  timer = setInterval(() => {
    countdown--;
    resend.textContent = 'Resend (' + countdown + 's)';
    if (countdown <= 0) {
      clearInterval(timer);
      resend.textContent = "Resend";
      resend.classList.remove("disabled");
      resend.style.pointerEvents = "auto";
      resend.style.color = "red";
    }
  }, 1000);
});
</script>
  </form>
</div>

{% endblock %}
