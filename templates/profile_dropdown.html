<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Profile — InvestCryptoView</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
body{margin:0;background:#f1f5f9;font-family:Inter,system-ui}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:#1e293b;color:#cbd5e1;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;padding:0 22px 14px}
.brand i{color:#2563eb}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 22px;border-left:4px solid transparent}
.nav a:hover{background:#334155;color:#fff;border-left-color:#2563eb}
.main{background:#fff;padding:22px 28px;box-shadow:inset 0 0 0 1px #e2e8f0}
.card{max-width:600px;margin:auto;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.05);padding:22px}
.btn{padding:12px;width:100%;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin:6px 0}
.primary{background:#2563eb;color:#fff}
.red{background:#ef4444;color:#fff}
.confirm{display:none;text-align:center;background:#ecfdf5;border:1px solid #bbf7d0;color:#065f46;border-radius:10px;padding:10px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<aside class="sidebar">
  <div class="brand"><i class="fa-solid fa-chart-line"></i>InvestCryptoView</div>
</aside>

<main class="main">
  <div class="card">
    <h2>Profile Settings</h2>
    <button class="btn primary" onclick="location.href='{{ url_for('edit_profile') }}'"><i class="fa-solid fa-user-pen"></i> Edit Profile</button>
    <button class="btn primary" onclick="location.href='{{ url_for('privacy') }}'"><i class="fa-solid fa-shield-halved"></i> Privacy & Policy</button>
    <button class="btn red" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
    <div class="confirm" id="confirmBox">
      <p>Are you sure you want to log out?</p>
      <button class="btn red" onclick="location.href='{{ url_for('logout') }}'">Yes</button>
      <button class="btn primary" onclick="document.getElementById('confirmBox').style.display='none'">No</button>
    </div>
  </div>
</main>
</div>
<script>
document.getElementById('logout').onclick=()=>document.getElementById('confirmBox').style.display='block';
</script>
</body>
</html>
