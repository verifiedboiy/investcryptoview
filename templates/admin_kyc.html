<!doctype html>
<html>
<head><meta charset="utf-8"><title>Admin — KYC</title></head>
<body style="font-family:Inter,Arial;background:#f1f5f9;margin:0">
  <div style="display:flex">
    <aside style="width:260px;background:#1e293b;color:#cbd5e1;padding:16px">Admin</aside>
    <main style="padding:22px;flex:1">
      <h2>KYC queue</h2>
      <div style="background:#fff;padding:12px;border-radius:12px;box-shadow:0 10px 30px rgba(2,8,23,.06)">
        <table width="100%" cellpadding="10">
          <thead><tr><th>ID</th><th>Name</th><th>KYC</th><th>Action</th></tr></thead>
          <tbody>
          {% for u in users %}
            <tr>
              <td>{{ u.id }}</td>
              <td>{{ u.name }}</td>
              <td>{{ u.kyc_status }}</td>
              <td>
                <form method="post" action="{{ url_for('admin_kyc_approve', user_id=u.id) }}" style="display:inline"><button>Approve</button></form>
                <form method="post" action="{{ url_for('admin_kyc_decline', user_id=u.id) }}" style="display:inline"><button>Decline</button></form>
              </td>
            </tr>
          {% endfor %}
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
